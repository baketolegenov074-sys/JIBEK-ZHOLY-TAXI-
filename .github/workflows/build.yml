name: Build three Flutter Android APKs

on:
  push:
    branches:
      - flutter-migration
  pull_request:
    branches:
      - flutter-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Install Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Generate missing Flutter Android projects
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org kz.jibekzholy --project-name jibek_passenger apps/passenger
          flutter create --platforms=android --org kz.jibekzholy --project-name jibek_driver apps/driver
          flutter create --platforms=android --org kz.jibekzholy --project-name jibek_owner_admin apps/owner_admin

      - name: Pin Android build tooling (Gradle 8.7, AGP 8.6.1, Kotlin 2.0.21, SDK 35)
        shell: bash
        run: |
          set -euo pipefail
          for app in passenger driver owner_admin; do
            settings="apps/$app/android/settings.gradle"
            wrapper="apps/$app/android/gradle/wrapper/gradle-wrapper.properties"
            app_gradle="apps/$app/android/app/build.gradle"
            sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.6.1"/' "$settings"
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.0.21"/' "$settings"
            sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip#' "$wrapper"
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' "$app_gradle"
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' "$app_gradle"
          done

      - name: Build passenger APK
        working-directory: apps/passenger
        run: |
          flutter pub get
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../../ClientTaxi.apk

      - name: Build driver APK
        working-directory: apps/driver
        run: |
          flutter pub get
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../../DriverTaxi.apk

      - name: Build owner admin APK
        working-directory: apps/owner_admin
        run: |
          flutter pub get
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk ../../OwnerAdmin.apk

      - name: Upload three APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JIBEK-ZHOLY-APKs
          path: |
            ClientTaxi.apk
            DriverTaxi.apk
            OwnerAdmin.apk
          if-no-files-found: error
          retention-days: 14
