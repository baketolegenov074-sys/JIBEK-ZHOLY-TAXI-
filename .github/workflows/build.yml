name: JIBEK ZHOLY TAXI - Build 3 APKs

on:
  push:
    branches:
      - main
      - flutter-migration
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - flutter-migration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Generate Android project files
        run: flutter create --platforms=android --org kz.jibekzholy --project-name jibek_zholy_taxi .

      - name: Prepare three minimal entry points
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lib

          if [ ! -f lib/main_client.dart ]; then
            cat > lib/main_client.dart <<'DART'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const MaterialApp(
              home: Scaffold(
                body: Center(child: Text('JIBEK ZHOLY TAXI - CLIENT')),
              ),
            ));
          }
          DART
          fi

          if [ ! -f lib/main_driver.dart ]; then
            cat > lib/main_driver.dart <<'DART'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const MaterialApp(
              home: Scaffold(
                body: Center(child: Text('JIBEK ZHOLY TAXI - DRIVER')),
              ),
            ));
          }
          DART
          fi

          if [ ! -f lib/main_admin.dart ]; then
            cat > lib/main_admin.dart <<'DART'
          import 'package:flutter/material.dart';

          void main() {
            runApp(const MaterialApp(
              home: Scaffold(
                body: Center(child: Text('JIBEK ZHOLY TAXI - OWNER ADMIN')),
              ),
            ));
          }
          DART
          fi

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build ClientTaxi.apk
        run: |
          flutter build apk --release -t lib/main_client.dart
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ClientTaxi.apk

      - name: Build DriverTaxi.apk
        run: |
          flutter build apk --release -t lib/main_driver.dart
          cp build/app/outputs/flutter-apk/app-release.apk dist/DriverTaxi.apk

      - name: Build OwnerAdmin.apk
        run: |
          flutter build apk --release -t lib/main_admin.dart
          cp build/app/outputs/flutter-apk/app-release.apk dist/OwnerAdmin.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JIBEK-ZHOLY-TAXI-APKs
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClientTaxi.apk
            dist/DriverTaxi.apk
            dist/OwnerAdmin.apk
          generate_release_notes: true
